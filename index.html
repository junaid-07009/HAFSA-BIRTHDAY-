<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Hafsa!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Fredoka:wght@400;600&display=swap">
<style>
:root{--k:#0a0a0c;--g1:#f6e27a;--g2:#d4af37;--g3:#8a6d1c;--cream:#fff6d8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#2e240a,var(--k) 65%) fixed;color:var(--cream);font-family:Fredoka,"Trebuchet MS",sans-serif;overflow-x:hidden;text-align:center}
#c{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:30px 18px 44px;max-width:520px;margin:0 auto}
h1{margin:0;font:italic 600 clamp(24px,7vw,34px)/1.2 "Playfair Display",Georgia,serif;color:var(--g1);letter-spacing:.5px}
.name{font:700 clamp(68px,23vw,120px)/1.05 "Playfair Display",Georgia,serif;margin:2px 0 14px;background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.frame{position:relative;width:min(62vw,240px);padding:6px;border-radius:999px 999px 20px 20px;background:linear-gradient(135deg,var(--g1),var(--g2) 50%,var(--g3));box-shadow:0 0 36px rgba(212,175,55,.45);animation:bob 4s ease-in-out infinite}
.frame img{display:block;width:100%;aspect-ratio:7/10;object-fit:cover;object-position:50% 62%;border-radius:999px 999px 14px 14px;background:#111}
.frame i{position:absolute;font-style:normal;font-size:22px}
@keyframes bob{50%{transform:translateY(-6px)}}
svg{width:min(88vw,360px);height:auto;margin-top:10px}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .35s ease-in-out infinite alternate;transition:opacity .4s}
.flame:nth-of-type(2n){animation-delay:.15s}
.off .flame{opacity:0;animation:none}
@keyframes fl{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.9,1.15) rotate(4deg)}}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}
button{font:inherit;font-weight:600;font-size:17px;border:0;border-radius:999px;padding:13px 22px;background:linear-gradient(180deg,var(--g1),var(--g2));color:#2a1d00;cursor:pointer;box-shadow:0 4px 0 var(--g3)}
button.alt{background:#16130a;color:var(--g1);box-shadow:0 0 0 2px var(--g2),0 4px 0 var(--g3)}
button:active{transform:translateY(3px)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.card{background:rgba(212,175,55,.08);border:2px solid var(--g2);border-radius:22px;padding:18px 20px;font-size:18px;line-height:1.55;max-width:420px}
.card small{display:block;margin-top:8px;color:var(--g1);font-size:16px}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(circle at 50% 35%,#2e240a,var(--k));padding:20px}
#intro p{font:italic 600 27px/1.3 "Playfair Display",Georgia,serif;color:var(--g1);margin:0;max-width:300px}
#intro button{font-size:20px;padding:16px 28px}
#intro.go{opacity:0;pointer-events:none;transition:opacity .6s}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;padding:8px 12px;font-size:20px;background:rgba(212,175,55,.2);color:#fff;box-shadow:none}
.bl{position:fixed;bottom:-90px;width:34px;height:44px;border-radius:50% 50% 48% 48%;z-index:0;animation:up linear infinite}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:38px;background:rgba(246,226,122,.6)}
.bl.g{background:radial-gradient(circle at 35% 30%,var(--g1),#a5801b)}
.bl.k{background:radial-gradient(circle at 35% 30%,#5a5a5a,#0a0a0a);box-shadow:0 0 0 1.5px var(--g2)}
@keyframes up{to{transform:translateY(-125vh) rotate(10deg)}}
#cd{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;pointer-events:none;font:700 clamp(120px,48vw,260px)/1 "Playfair Display",Georgia,serif;color:var(--g1);text-shadow:0 0 40px rgba(212,175,55,.8);background:rgba(10,10,12,.88)}
#cd.on{display:flex;animation:pp .9s ease-out}
#cd.big{font-size:clamp(46px,15vw,84px);background:transparent;padding:0 18px;line-height:1.1;flex-wrap:wrap}
@keyframes pp{from{transform:scale(.4);opacity:0}30%{opacity:1}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#cd.on{animation:none}}
@media (prefers-reduced-motion:reduce){.bl,.flame,.frame{animation:none}}
</style>
</head>

<span class="bl k" style="left:22%;animation-duration:14s;animation-delay:3s"></span>
<span class="bl g" style="left:46%;animation-duration:12s;animation-delay:6s"></span>
<span class="bl k" style="left:68%;animation-duration:15s;animation-delay:1s"></span>
<span class="bl g" style="left:88%;animation-duration:13s;animation-delay:5s"></span>

<div id="intro">

  <button id="start">🎁 Surprise kholo</button>
</div>

<script>
(function(){
var cv=document.getElementById('c'),x=cv.getContext('2d'),W,H,dpr;
function rs(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();
var cols=['#f6e27a','#d4af37','#fff6d8','#ffffff','#c9922b','#ffdf8a'];
var rk=[],pt=[],R=Math.random;
function launch(tx){rk.push({x:tx==null?W*(.1+R()*.8):tx,y:H+10,ty:H*(.12+R()*.38),vx:(R()-.5)*1.2,c:cols[(R()*cols.length)|0]})}
function boom(r){var n=70+(R()*30|0);for(var i=0;i<n;i++){var a=R()*6.283,s=1+R()*5;pt.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:70+R()*40,m:110,c:R()<.6?r.c:cols[(R()*cols.length)|0],k:0})}}
function confetti(){for(var i=0;i<160;i++)pt.push({x:R()*W,y:-20-R()*H*.4,vx:(R()-.5)*2,vy:1+R()*2.5,l:260,m:260,c:cols[(R()*cols.length)|0],k:1,w:6+R()*6,a:R()*6,va:(R()-.5)*.3})}
function tick(){
 x.clearRect(0,0,W,H);
 for(var i=rk.length-1;i>=0;i--){var r=rk[i];r.y-=9;r.x+=r.vx;
  pt.push({x:r.x,y:r.y,vx:(R()-.5)*.6,vy:R()*1.2,l:18,m:18,c:'#f6e27a',k:0});
  x.fillStyle='#fff';x.fillRect(r.x-2,r.y,4,12);
  if(r.y<=r.ty){boom(r);rk.splice(i,1)}}
 for(var j=pt.length-1;j>=0;j--){var p=pt[j];p.l--;if(p.l<=0){pt.splice(j,1);continue}
  p.x+=p.vx;p.y+=p.vy;
  if(p.k){p.a+=p.va;p.vx+=Math.sin(p.a)*.03;x.globalAlpha=Math.min(1,p.l/40);x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()}
  else{p.vy+=.05;p.vx*=.985;x.globalAlpha=p.l/p.m;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.4,0,6.283);x.fill()}}
 x.globalAlpha=1;requestAnimationFrame(tick)}
tick();

/* Happy Birthday: music-box melody + waltz bass and chords + soft echo */
var ac,master,muted=false,B=.52;
var C={b:130.8,c:[261.6,329.6,392]},G={b:98,c:[246.9,293.7,349.2]},F={b:87.3,c:[220,261.6,349.2]};
var L=[
 {m:[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2]],h:[C,G]},
 {m:[[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2]],h:[G,C]},
 {m:[[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,1]],h:[C,G]},
 {m:[[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,3]],h:[F,C]}];
function bell(f,t,d,v){var o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain();o.frequency.value=f;o2.frequency.value=f*3;o.connect(g);o2.connect(g2);g.connect(master);g2.connect(master);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d*1.5);
 g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(v*.25,t+.005);g2.gain.exponentialRampToValueAtTime(.0008,t+d*.5);
 o.start(t);o2.start(t);o.stop(t+d*1.6);o2.stop(t+d*.6)}
function pl(f,t,d,v){var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(master);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.start(t);o.stop(t+d+.05)}
function chord(c,t,d){for(var i=0;i<c.length;i++)pl(c[i],t,d,.09)}
function tune(){if(!ac)return;var t=ac.currentTime+.15,i,j,l,s,a,b;
 for(i=0;i<4;i++){l=L[i];s=t;a=l.h[0];b=l.h[1];
  for(j=0;j<l.m.length;j++){bell(l.m[j][0],t,l.m[j][1]*B,.5);t+=l.m[j][1]*B}
  pl(a.b,s+B,B*2,.26);chord(a.c,s+2*B,B*.9);chord(a.c,s+3*B,B*.9);
  pl(b.b,s+4*B,B*2,.26);chord(b.c,s+5*B,B*(i==3?3:.9))}
 setTimeout(tune,(t-ac.currentTime+1.6)*1000)}
function startAudio(){try{var AC=window.AudioContext||window.webkitAudioContext;ac=new AC();master=ac.createGain();master.gain.value=.6;
 var dl=ac.createDelay(),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.27;fb.gain.value=.3;wet.gain.value=.35;
 master.connect(ac.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ac.destination);
 if(ac.resume)ac.resume()}catch(e){}}

var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
var voice=null;
function pick(){var v=speechSynthesis.getVoices(),i,re=/female|samantha|zira|karen|moira|tessa|susan|victoria|serena|fiona|google us english|google uk english female/i;for(i=0;i<v.length;i++)if(/^en/i.test(v[i].lang)&&re.test(v[i].name)){voice=v[i];return}for(i=0;i<v.length;i++)if(/^en/i.test(v[i].lang)){voice=v[i];return}}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,rate,pitch){if(!window.speechSynthesis)return;try{var u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=(voice&&voice.lang)||'en-US';u.rate=rate;u.pitch=pitch;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
var cd=document.getElementById('cd');
function pop(t,cls){cd.className='';void cd.offsetWidth;cd.textContent=t;cd.className='on'+(cls?' '+cls:'')}
document.getElementById('start').onclick=function(){
 document.getElementById('intro').className='go';startAudio();
 var n=['3','2','1'],w=['Three','Two','One'],i=0;
 function step(){
  if(i<3){pop(n[i]);say(w[i],.85,1.6);i++;setTimeout(step,1100)}
  else{pop('Happy Birthday Hafsa!','big');say('Happy Birthday Hafsa!',.9,1.8);
   launch();setTimeout(launch,250);setTimeout(launch,500);confetti();
   setTimeout(tune,2600);setTimeout(function(){cd.className=''},3400);
   setInterval(function(){launch()},reduce?2600:900)}}
 step()};
document.getElementById('mute').onclick=function(){muted=!muted;if(master)master.gain.value=muted?0:.6;this.textContent=muted?'🔇':'🔊'};
var cake=document.getElementById('cake'),blow=document.getElementById('blow'),out=false;
blow.onclick=function(){out=!out;cake.classList.toggle('off',out);blow.textContent=out?'🕯️ Dobara jalao':'🕯️ Candles bujhao';
 if(out){confetti();for(var i=0;i<6;i++)setTimeout(launch,i*180)}};
document.getElementById('boom').onclick=function(){for(var i=0;i<7;i++)setTimeout(launch,i*150)};
document.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;launch(e.clientX)});
})();
</script>
